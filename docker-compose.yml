version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: dixoraclecore-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dixoraclecore
    restart: unless-stopped
    networks:
      - dixoraclecore-network

  # API Server
  api:
    build: ./api-server
    container_name: dixoraclecore-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URL=mongodb://mongodb:27017/dixoraclecore
      - JWT_SECRET=dev-jwt-secret-change-in-production
    depends_on:
      - mongodb
    volumes:
      - ./api-server:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - dixoraclecore-network

  # Web Frontend (for production builds)
  # web:
  #   build: ./web
  #   container_name: dixoraclecore-web
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api
  #   restart: unless-stopped
  #   networks:
  #     - dixoraclecore-network

volumes:
  mongodb_data:
    driver: local

networks:
  dixoraclecore-network:
    driver: bridge
